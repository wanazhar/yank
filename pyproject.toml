[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yank"
version = "0.1.0"
description = "A terminal UI wrapper for yt-dlp — paste URL, pick format, download"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yank contributors" }]
keywords = ["yt-dlp", "tui", "download", "youtube", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "textual>=0.80.0",
    "yt-dlp>=2024.1.0",
    "pyfiglet>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
yank = "yank.__main__:main"

[project.urls]
Homepage = "https://github.com/wanazhar/yank"
Source = "https://github.com/wanazhar/yank"
BugTracker = "https://github.com/wanazhar/yank/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
